# 服务端口；反向代理后通过 X-Forwarded-* 识别协议和主机
server:
  port: 8080
  forward-headers-strategy: framework
  # 收到停止信号后等待进行中的请求完成
  shutdown: graceful

spring:
  application:
    name: healthcare-api
  lifecycle:
    timeout-per-shutdown-phase: 20s
  # 头像上传限制
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB
  # 数据源：生产环境通过 DB_URL / DB_USER / DB_PASSWORD 覆盖
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/healthcare?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8}
    username: ${DB_USER:healthcare}
    password: ${DB_PASSWORD:healthcare_dev}
  # JPA 只校验实体与表结构是否一致，建表/改表交给 Flyway
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Shanghai
  # Flyway 迁移：已有数据库会先 baseline，后续结构变更新增 V3、V4...
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration

# 运维：仅暴露健康检查，供容器/负载均衡探活
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

# 应用配置：开发模式、跨域、登录 Cookie、限流和短信 Webhook
app:
  dev-mode: ${APP_DEV_MODE:true}
  upload-dir: ${APP_UPLOAD_DIR:./data/uploads}
  token-ttl-days: ${APP_TOKEN_TTL_DAYS:7}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:5175}
  auth:
    cookie-name: ${AUTH_COOKIE_NAME:healthcare_token}
    cookie-secure: ${AUTH_COOKIE_SECURE:false}
    cookie-same-site: ${AUTH_COOKIE_SAME_SITE:Lax}
  rate-limit:
    send-code-cooldown-seconds: ${SEND_CODE_COOLDOWN_SECONDS:60}
    send-code-max-per-hour: ${SEND_CODE_MAX_PER_HOUR:10}
    login-max-attempts-per-10-min: ${LOGIN_MAX_ATTEMPTS_PER_10_MIN:10}
    phone-change-max-per-hour: ${PHONE_CHANGE_MAX_PER_HOUR:5}
    login-ip-max-per-10-min: ${LOGIN_IP_MAX_PER_10_MIN:100}
    send-code-ip-max-per-hour: ${SEND_CODE_IP_MAX_PER_HOUR:30}
    step-up-max-per-hour: ${STEP_UP_MAX_PER_HOUR:5}
  sms:
    webhook-url: ${SMS_WEBHOOK_URL:}
    webhook-token: ${SMS_WEBHOOK_TOKEN:}
  # Web Push：生产环境务必配置固定 VAPID 密钥，否则重启后订阅失效
  push:
    public-key: ${VAPID_PUBLIC_KEY:}
    private-key: ${VAPID_PRIVATE_KEY:}
    subject: ${VAPID_SUBJECT:mailto:support@healthcare.example}
  # 通用 MQTT 设备接入：可连接 EMQX / Mosquitto / 阿里云 MQTT 版
  iot:
    mqtt:
      enabled: ${MQTT_ENABLED:false}
      broker-url: ${MQTT_BROKER_URL:tcp://127.0.0.1:1883}
      client-id: ${MQTT_CLIENT_ID:healthcare-api}
      username: ${MQTT_USERNAME:}
      password: ${MQTT_PASSWORD:}
      topic: ${MQTT_TOPIC:sys/+/+/thing/event/property/post}
      qos: ${MQTT_QOS:1}
