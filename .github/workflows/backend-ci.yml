name: Backend CI

on:
  push:
    paths:
      - "healthcare-api/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "healthcare-api/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: healthcare-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - run: mvn -B test
