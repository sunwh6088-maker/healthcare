services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: healthcare
      MYSQL_USER: healthcare
      MYSQL_PASSWORD: ${DB_PASSWORD:-healthcare_dev}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 中设置 MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: ./healthcare-api
    restart: unless-stopped
    environment:
      DB_URL: jdbc:mysql://mysql:3306/healthcare?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8
      DB_USER: healthcare
      DB_PASSWORD: ${DB_PASSWORD:-healthcare_dev}
      APP_DEV_MODE: ${APP_DEV_MODE:-false}
      APP_UPLOAD_DIR: /app/data/uploads
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      AUTH_COOKIE_SAME_SITE: ${AUTH_COOKIE_SAME_SITE:-Lax}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8088}
      SMS_WEBHOOK_URL: ${SMS_WEBHOOK_URL:-}
      SMS_WEBHOOK_TOKEN: ${SMS_WEBHOOK_TOKEN:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:support@healthcare.example}
      MQTT_ENABLED: ${MQTT_ENABLED:-false}
      MQTT_BROKER_URL: ${MQTT_BROKER_URL:-tcp://mqtt:1883}
      MQTT_CLIENT_ID: ${MQTT_CLIENT_ID:-healthcare-api}
      MQTT_USERNAME: ${MQTT_USERNAME:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
      MQTT_TOPIC: ${MQTT_TOPIC:-sys/+/+/thing/event/property/post}
      MQTT_QOS: ${MQTT_QOS:-1}
      SEND_CODE_COOLDOWN_SECONDS: ${SEND_CODE_COOLDOWN_SECONDS:-60}
      SEND_CODE_MAX_PER_HOUR: ${SEND_CODE_MAX_PER_HOUR:-10}
      LOGIN_MAX_ATTEMPTS_PER_10_MIN: ${LOGIN_MAX_ATTEMPTS_PER_10_MIN:-10}
      PHONE_CHANGE_MAX_PER_HOUR: ${PHONE_CHANGE_MAX_PER_HOUR:-5}
      LOGIN_IP_MAX_PER_10_MIN: ${LOGIN_IP_MAX_PER_10_MIN:-100}
      SEND_CODE_IP_MAX_PER_HOUR: ${SEND_CODE_IP_MAX_PER_HOUR:-30}
      STEP_UP_MAX_PER_HOUR: ${STEP_UP_MAX_PER_HOUR:-5}
    volumes:
      - uploads-data:/app/data
    depends_on:
      mysql:
        condition: service_healthy
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # 可选 MQTT broker（本地联调设备接入）：docker compose --profile iot up -d mqtt
  mqtt:
    image: emqx/emqx:5.8.4
    profiles: ["iot"]
    restart: unless-stopped
    environment:
      EMQX_DASHBOARD__DEFAULT_PASSWORD: ${EMQX_DASHBOARD_PASSWORD:-public}
    ports:
      - "${MQTT_PORT:-1883}:1883"
      - "${MQTT_DASHBOARD_PORT:-18083}:18083"
    volumes:
      - mqtt-data:/opt/emqx/data

  web:
    build: ./healthcare-app
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8088}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ > /dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  mysql-data:
  uploads-data:
  mqtt-data:
