services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: healthcare
      MYSQL_USER: healthcare
      MYSQL_PASSWORD: ${DB_PASSWORD:-healthcare_dev}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 中设置 MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: ./healthcare-api
    restart: unless-stopped
    environment:
      DB_URL: jdbc:mysql://mysql:3306/healthcare?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8
      DB_USER: healthcare
      DB_PASSWORD: ${DB_PASSWORD:-healthcare_dev}
      APP_DEV_MODE: ${APP_DEV_MODE:-false}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8088}
      SMS_WEBHOOK_URL: ${SMS_WEBHOOK_URL:-}
      SMS_WEBHOOK_TOKEN: ${SMS_WEBHOOK_TOKEN:-}
      SEND_CODE_COOLDOWN_SECONDS: ${SEND_CODE_COOLDOWN_SECONDS:-60}
      SEND_CODE_MAX_PER_HOUR: ${SEND_CODE_MAX_PER_HOUR:-10}
      LOGIN_MAX_ATTEMPTS_PER_10_MIN: ${LOGIN_MAX_ATTEMPTS_PER_10_MIN:-10}
    depends_on:
      mysql:
        condition: service_healthy
    expose:
      - "8080"

  web:
    build: ./healthcare-app
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8088}:80"
    depends_on:
      - api

volumes:
  mysql-data:
